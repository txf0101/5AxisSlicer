[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8,<9", "pybind11>=2.13,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "five-axis-slicer"
dynamic = ["version"]
description = "Five-axis additive manufacturing setup and toolpath preview workbench."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "5AxisSclicer contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "cadquery-ocp==7.8.1.1.post1",
    "jsonschema>=4.23,<5",
    "numpy>=1.26,<2.3",
    "PyOpenGL>=3.1,<4",
    "PyQt5>=5.15,<6",
    "ruamel.yaml>=0.18.6,<0.19",
    "vtk==9.3.1",
]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "mypy>=1.11,<2",
    "packaging>=24.2,<25",
    "pillow>=12.3,<13",
    "pip-audit>=2.9,<3",
    "pre-commit>=3.7,<5",
    "pytest>=9.0.3,<10",
    "pytest-timeout>=2.3,<3",
    "ruff>=0.12,<0.13",
    "tomli>=2; python_version < '3.11'",
    "twine>=6,<7",
]

# STEP fixture generation uses CadQuery; the application reads STEP through OCP directly.
cad-tests = ["cadquery>=2.7,<2.8"]

[project.scripts]
five-axis-slicer = "five_axis_slicer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"five_axis_slicer.manufacturing" = ["profiles/*.json"]

[tool.setuptools.data-files]
"share/five-axis-slicer/schemas" = ["schemas/*.json"]
"share/doc/five-axis-slicer/formats" = ["docs/formats/*.md"]
"share/doc/five-axis-slicer/guides" = ["docs/guides/*.md"]

[tool.setuptools_scm]
fallback_version = "2.0.0"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist", "outputs", "tmp"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
"src/five_axis_slicer/result_preview.py" = ["E402"]
# This file is restricted command text; its host names are checked by the DSL parser.
"example/pipe2/tube_setup_coordinate_demo/setup_demo.py" = ["F821"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.10"
files = ["src"]
mypy_path = "src"
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_configs = true

# Dynamic Qt/VTK surfaces retain legacy typing debt. New domain, storage, parser,
# and shared-viewer modules remain under the repository-wide checker above.
[[tool.mypy.overrides]]
module = [
    "five_axis_slicer.gcode_source",
    "five_axis_slicer.opengl_viewer",
    "five_axis_slicer.result_preview",
    "five_axis_slicer.result_state",
    "five_axis_slicer.ui",
    "five_axis_slicer.viewer",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--timeout=180",
]
xfail_strict = true
filterwarnings = [
    "error",
    "ignore:save will be removed in the next release\\.:FutureWarning:cadquery\\.utils",
]

[tool.context-budget]
source_root = "src/five_axis_slicer"
module_lines = 1000
class_lines = 500
function_lines = 60
complexity = 15

# Exact high-water marks keep legacy debt visible and prevent new growth.
[tool.context-budget.legacy]
"algorithms/rotary/geometry.py" = { module_lines = 1110, function_lines = 232 }
"gcode_arrays.py" = { complexity = 18 }
"gcode_cache.py" = { function_lines = 70 }
"gcode_preview.py" = { module_lines = 1173 }
"manufacturing/coordinates.py" = { module_lines = 1115, complexity = 17 }
"manufacturing/library.py" = { function_lines = 64 }
"manufacturing/machine.py" = { module_lines = 1143, function_lines = 91 }
"manufacturing/preview_kinematics.py" = { function_lines = 87 }
"manufacturing/resources.py" = { module_lines = 1072, function_lines = 72, complexity = 23 }
"manufacturing/setup.py" = { complexity = 16 }
"kinematics/xyzac.py" = { complexity = 16 }
"kinematics/rotary.py" = { function_lines = 149, complexity = 31 }
"opengl_scene.py" = { function_lines = 86, complexity = 20 }
"opengl_viewer.py" = { module_lines = 1866, class_lines = 1587, function_lines = 86, complexity = 17 }
"result_preview.py" = { module_lines = 1658, class_lines = 1187 }
"postprocessing/rotary_product.py" = { function_lines = 83 }
"postprocessing/gcode_readback.py" = { function_lines = 61 }
"postprocessing/indexed_tube.py" = { function_lines = 68 }
"rotary_operation_service.py" = { function_lines = 148, complexity = 55 }
"rotary_ui.py" = { module_lines = 1048, class_lines = 806, function_lines = 118 }
"tube_controller.py" = { module_lines = 1184, class_lines = 962 }
"tube_ui.py" = { module_lines = 1651, class_lines = 1372 }
"ui.py" = { module_lines = 2806, class_lines = 2695, function_lines = 148 }
